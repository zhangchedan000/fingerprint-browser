name: Windows build

on:
  push:
    branches: [main, refactor-core]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npx vitest run --fileParallelism=false --reporter=default --reporter=json --outputFile=vitest.json
      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          node -e '
            const r = require("./vitest.json")
            for (const f of r.testResults) {
              const file = f.name.replace(process.cwd() + "\\", "").replace(/\\/g, "/")
              if (f.status === "failed" && !f.assertionResults.some((a) => a.status === "failed")) console.log(`::error file=${file}::${(f.message || "suite failed").split("\n").slice(0, 6).join(" | ")}`)
              for (const a of f.assertionResults) if (a.status === "failed") console.log(`::error file=${file}::${a.fullName} :: ${(a.failureMessages[0] || "").split("\n").slice(0, 4).join(" | ")}`)
            }'
      - name: Build installer (unsigned)
        shell: bash
        run: |
          set -o pipefail
          npm run dist:win 2>&1 | tee build.log || { grep -v "duplicate dependency" build.log | tail -n 40 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log("::error::"+s.replace(/%/g,"%25").replace(/\r?\n/g,"%0A")))'; exit 1; }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: fingerprint-browser-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14
