name: Windows build

on:
  push:
    branches: [main, refactor-core]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npx vitest run --fileParallelism=false
      - name: Build installer (unsigned)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: fingerprint-browser-windows
          path: |
            release/*.msi
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14
