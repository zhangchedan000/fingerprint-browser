name: Kernel smoke test

on:
  workflow_dispatch:
    inputs:
      kernels:
        description: Kernel major versions, comma separated
        default: '144,148,150'
      bisect:
        description: Drop launch arguments one at a time to find the one that crashes
        type: boolean
        default: false
      urls:
        description: Pages to open, comma separated
        default: 'https://www.baidu.com,https://www.google.com,https://browserleaks.com/'
  push:
    branches: [refactor-core]
    paths: [tools/kernel-smoke/**, .github/workflows/kernel-smoke.yml]

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright-core@1.48.2
      - name: Open sites in each kernel
        run: node tools/kernel-smoke/run.mjs
        env:
          KERNELS: ${{ inputs.kernels || '144,148,150' }}
          URLS: ${{ inputs.urls || 'https://www.baidu.com,https://www.google.com,https://browserleaks.com/' }}
          BISECT: ${{ inputs.bisect && '1' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
