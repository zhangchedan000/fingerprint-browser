# Nginx Proxy Manager custom host for the team server, as deployed on the Singapore server:
# /opt/nginx-proxy-manager/data/nginx/proxy_host/prism-team-custom.conf
# Certificate: docker exec nginx-proxy-manager certbot certonly --webroot -w /data/letsencrypt-acme-challenge -d <domain> --key-type ecdsa
server {
    listen 80;
    server_name temu.orenge.ccwu.cc;
    include conf.d/include/letsencrypt-acme-challenge.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name temu.orenge.ccwu.cc;
    ssl_certificate /etc/letsencrypt/live/temu.orenge.ccwu.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/temu.orenge.ccwu.cc/privkey.pem;
    include conf.d/include/ssl-cache.conf;
    include conf.d/include/ssl-ciphers.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Login state archives can be large; stream them instead of buffering on disk.
    client_max_body_size 2048m;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $team_backend http://prism-team:8090;
        proxy_pass $team_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }
}
